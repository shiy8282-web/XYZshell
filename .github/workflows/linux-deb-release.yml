name: XYZshell release packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to publish, matching pkg/xyzshell/VERSION, for example 0.1.9
        required: true
        default: "0.1.9"
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve release tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$TAG_INPUT"
          version="$(printf '%s' "$tag" | sed 's/^v//')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+~:-][A-Za-z0-9.+~:-]+)?$ ]]; then
            echo "Expected a version like 0.1.0 or v0.1.0, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check out workflow source
        uses: actions/checkout@v5
      - name: Validate workflow source version
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(tr -d '[:space:]' < pkg/xyzshell/VERSION)"
          if [[ "$source_version" != "$RELEASE_VERSION" ]]; then
            echo "Release tag version $RELEASE_VERSION does not match pkg/xyzshell/VERSION ($source_version)" >&2
            exit 1
          fi
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "XYZshell $RELEASE_TAG" --generate-notes
          fi
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.tag }}
      - name: Validate release tag version
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(tr -d '[:space:]' < pkg/xyzshell/VERSION)"
          if [[ "$source_version" != "$RELEASE_VERSION" ]]; then
            echo "Release tag version $RELEASE_VERSION does not match pkg/xyzshell/VERSION ($source_version)" >&2
            exit 1
          fi

  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Fyne Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Build Linux AMD64 binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/bin/xyzshell-gui ./cmd/xyzshell-gui
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/bin/xyzshell-cli ./cmd/xyzshell

      - name: Build portable Linux AMD64 archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          portable="dist/XYZshell-linux-amd64"
          mkdir -p "$portable"
          cp dist/bin/xyzshell-gui "$portable/"
          cp dist/bin/xyzshell-cli "$portable/"
          cat > "$portable/run.sh" <<'EOF'
          #!/bin/sh
          set -eu
          dir="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$dir/xyzshell-gui" "$@"
          EOF
          cat > "$portable/README.txt" <<'EOF'
          XYZshell Linux AMD64 portable package
          Extract this archive, then run ./run.sh for the graphical application
          or ./xyzshell-cli for the command-line client.
          A 64-bit Linux desktop with the graphics libraries used by Fyne is required.
          EOF
          chmod +x "$portable/xyzshell-gui" "$portable/xyzshell-cli" "$portable/run.sh"
          tar -czf "dist/XYZshell-linux-amd64-v$VERSION.tar.gz" -C dist XYZshell-linux-amd64
      - name: Upload portable Linux AMD64 archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: gh release upload "$TAG" "dist/XYZshell-linux-amd64-v$VERSION.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  build-linux-arm64:
    needs: prepare
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Fyne Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Build Linux ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/bin/xyzshell-gui ./cmd/xyzshell-gui
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/bin/xyzshell-cli ./cmd/xyzshell

      - name: Build portable Linux ARM64 archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          portable="dist/xyzshell-linux-arm64"
          mkdir -p "$portable"
          cp dist/bin/xyzshell-gui "$portable/"
          cp dist/bin/xyzshell-cli "$portable/"
          cat > "$portable/run.sh" <<'EOF'
          #!/bin/sh
          set -eu
          dir="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$dir/xyzshell-gui" "$@"
          EOF
          cat > "$portable/README.txt" <<'EOF'
          XYZshell Linux ARM64 portable package
          Extract this archive, then run ./run.sh for the graphical application
          or ./xyzshell-cli for the command-line client.
          A 64-bit ARM Linux desktop with the graphics libraries used by Fyne is required.
          EOF
          chmod +x "$portable/xyzshell-gui" "$portable/xyzshell-cli" "$portable/run.sh"
          tar -czf "dist/XYZshell-linux-arm64-v$VERSION.tar.gz" -C dist xyzshell-linux-arm64
      - name: Upload portable Linux ARM64 archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: gh release upload "$TAG" "dist/XYZshell-linux-arm64-v$VERSION.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Set up MSYS2 GCC for Fyne
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Add 64-bit GCC to Windows PATH
        shell: pwsh
        run: |
          $gccDir = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw64\bin"
          if (-not (Test-Path (Join-Path $gccDir "gcc.exe"))) { throw "MSYS2 64-bit GCC was not found at $gccDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $gccDir
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows GUI and CLI
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          gcc --version
          go env GOOS GOARCH CGO_ENABLED CC
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/xyzshell-gui.exe ./cmd/xyzshell-gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags="-s -w" -o dist/xyzshell-cli.exe ./cmd/xyzshell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = "${{ needs.prepare.outputs.version }}"
          $archive = "dist/XYZshell-windows-x64-v$version.zip"
          Compress-Archive -Path dist/xyzshell-gui.exe, dist/xyzshell-cli.exe -DestinationPath $archive -Force
      - name: Upload Windows package to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: gh release upload $env:TAG ("dist/XYZshell-windows-x64-v" + $env:VERSION + ".zip") --repo $env:GITHUB_REPOSITORY --clobber

  build-windows-386:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Set up MSYS2 32-bit GCC for Fyne
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          suppress-deprecation-warnings: msystem-mingw32
          update: true
          install: mingw-w64-i686-gcc
      - name: Add 32-bit GCC to Windows PATH
        shell: pwsh
        run: |
          $gccDir = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw32\bin"
          if (-not (Test-Path (Join-Path $gccDir "gcc.exe"))) { throw "MSYS2 32-bit GCC was not found at $gccDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $gccDir
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows 32-bit GUI and CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = "1"
          $env:GOARCH = "386"
          gcc --version
          go env GOOS GOARCH CGO_ENABLED CC
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/xyzshell-gui.exe ./cmd/xyzshell-gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags="-s -w" -o dist/xyzshell-cli.exe ./cmd/xyzshell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = "${{ needs.prepare.outputs.version }}"
          $archive = "dist/XYZshell-windows-x86-32bit-v$version.zip"
          Compress-Archive -Path dist/xyzshell-gui.exe, dist/xyzshell-cli.exe -DestinationPath $archive -Force
      - name: Upload Windows 32-bit package to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: gh release upload $env:TAG ("dist/XYZshell-windows-x86-32bit-v" + $env:VERSION + ".zip") --repo $env:GITHUB_REPOSITORY --clobber

  build-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
            asset_arch: x64
          - runner: macos-15
            goarch: arm64
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build macOS app and CLI archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/XYZshell-macos-"$ASSET_ARCH
          app_dir="$package_dir/XYZshell.app/Contents"
          mkdir -p "$app_dir/MacOS"
          CGO_ENABLED=1 GOOS=darwin GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "$app_dir/MacOS/XYZshell" ./cmd/xyzshell-gui
          CGO_ENABLED=1 GOOS=darwin GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "$package_dir/xyzshell-cli" ./cmd/xyzshell
          chmod +x "$app_dir/MacOS/XYZshell" "$package_dir/xyzshell-cli"
          cat > "$app_dir/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>XYZshell</string>
            <key>CFBundleIdentifier</key><string>com.shiy8282.xyzshell</string>
            <key>CFBundleName</key><string>XYZshell</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          archive="dist/XYZshell-macos-"$ASSET_ARCH"-v"$VERSION".zip"
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" "$archive"
      - name: Upload macOS package to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        shell: bash
        run: gh release upload "$TAG" "dist/XYZshell-macos-"$ASSET_ARCH"-v"$VERSION".zip" --repo "$GITHUB_REPOSITORY" --clobber

